name: Portfolio demo

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type "deploy portfolio" to create the short-lived AWS environment
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: vantage-ai-portfolio
  cancel-in-progress: false

env:
  DEPLOY_COMMIT: ${{ github.sha }}
  ENV: portfolio
  TF_IN_AUTOMATION: "true"

jobs:
  deploy-and-verify:
    name: Deploy and verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: portfolio
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      PORTFOLIO_OWNER: ${{ vars.PORTFOLIO_OWNER || github.repository_owner }}
      PORTFOLIO_EXPIRES_AT: ${{ vars.PORTFOLIO_EXPIRES_AT }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      BEDROCK_INFERENCE_PROFILE_ARN: ${{ vars.BEDROCK_INFERENCE_PROFILE_ARN }}
      BEDROCK_FOUNDATION_MODEL_ARNS: ${{ vars.BEDROCK_FOUNDATION_MODEL_ARNS }}
    steps:
      - name: Confirm short-lived deployment
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "deploy portfolio" || {
            echo 'Confirmation must exactly match: deploy portfolio' >&2
            exit 1
          }

      - name: Check out deployment commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Prepare deployment coordinator
        run: python3 -m venv .venv

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: vantage-ai-demo-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify account and create ignored runtime configuration
        run: scripts/aws/preflight.sh

      - name: Initialize dedicated portfolio workspaces
        run: make tf-workspace

      - name: Apply L0 foundation from a saved plan
        run: |
          make tf-plan-l0
          make tf-apply-l0

      - name: Apply L1 platform from a saved plan
        run: |
          make tf-plan-l1
          make tf-apply-l1

      - name: Publish immutable artifacts and apply L2 application
        run: |
          make tf-plan-l2
          make tf-apply-l2

      - name: Verify the deployed document and Bedrock flow
        id: e2e
        run: |
          API_BASE_URL="$(terraform -chdir=terraform/layers/l2-application/vantage-ai output -raw cloudfront_url)"
          API_KEY_SECRET_NAME="$(terraform -chdir=terraform/layers/l2-application/vantage-ai output -raw api_key_secret_name)"
          export API_BASE_URL API_KEY_SECRET_NAME
          scripts/aws/e2e.sh

      - name: Capture sanitized evidence
        env:
          API_BASE_URL: ${{ steps.e2e.outputs.api_base_url }}
          DOCUMENT_ID: ${{ steps.e2e.outputs.document_id }}
        run: scripts/aws/capture-evidence.sh

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-evidence-${{ github.run_id }}
          path: artifacts/portfolio-evidence/
          if-no-files-found: warn
          retention-days: 14

  destroy-and-assert:
    name: Destroy and assert cleanup
    needs: deploy-and-verify
    if: ${{ always() && inputs.confirmation == 'deploy portfolio' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: portfolio
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      PORTFOLIO_OWNER: ${{ vars.PORTFOLIO_OWNER || github.repository_owner }}
      PORTFOLIO_EXPIRES_AT: ${{ vars.PORTFOLIO_EXPIRES_AT }}
      BEDROCK_MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
      BEDROCK_INFERENCE_PROFILE_ARN: ${{ vars.BEDROCK_INFERENCE_PROFILE_ARN }}
      BEDROCK_FOUNDATION_MODEL_ARNS: ${{ vars.BEDROCK_FOUNDATION_MODEL_ARNS }}
      TF_CLI_ARGS_destroy: -auto-approve
    steps:
      - name: Check out deployment commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Prepare deployment coordinator
        run: python3 -m venv .venv

      - name: Configure independent cleanup credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: vantage-ai-cleanup-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true
          unset-current-credentials: true

      - name: Verify cleanup account and recreate ignored configuration
        run: scripts/aws/preflight.sh

      - name: Initialize dedicated portfolio workspaces
        run: make tf-workspace

      - name: Destroy L2, L1, and L0
        id: destroy
        continue-on-error: true
        run: make tf-destroy

      - name: Assert runtime resource cleanup
        id: assert-clean
        if: always()
        continue-on-error: true
        run: |
          mkdir -p artifacts/portfolio-evidence
          scripts/aws/assert-clean.sh | tee artifacts/portfolio-evidence/cleanup.txt

      - name: Upload cleanup result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-cleanup-${{ github.run_id }}
          path: artifacts/portfolio-evidence/cleanup.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce successful destroy and cleanup assertion
        if: always()
        env:
          DESTROY_OUTCOME: ${{ steps.destroy.outcome }}
          ASSERT_OUTCOME: ${{ steps.assert-clean.outcome }}
        run: |
          set -euo pipefail
          test "$DESTROY_OUTCOME" = "success"
          test "$ASSERT_OUTCOME" = "success"
