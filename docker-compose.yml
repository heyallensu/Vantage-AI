services:
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENV: local
      API_KEY: local-development-only
      DATABASE_URL: postgresql://vantage:vantage@db:5432/vantage
      DB_NAME: vantage
      AWS_DEFAULT_REGION: ap-southeast-2
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_SHARED_CREDENTIALS_FILE: /home/vantage/.aws/credentials
      AWS_CONFIG_FILE: /home/vantage/.aws/config
      BEDROCK_MODEL_ID: au.anthropic.claude-haiku-4-5-20251001-v1:0
    volumes:
      - ~/.aws:/home/vantage/.aws:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vantage
      POSTGRES_PASSWORD: vantage
      POSTGRES_DB: vantage
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vantage -d vantage"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
