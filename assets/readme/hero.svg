<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Vantage AI — ephemeral AWS document intelligence platform</title>
  <desc id="desc">A secure versioned CSV document flows through a CloudFront edge, FastAPI, S3, SQS, Lambda, PostgreSQL, and Amazon Bedrock.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11151b"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#27303a" stroke-width="1" opacity="0.38"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ff9900"/>
    </marker>
  </defs>

  <rect width="1200" height="400" rx="24" fill="#0b0d10"/>
  <rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="#303944"/>
  <rect width="1200" height="400" rx="24" fill="url(#grid)" opacity="0.34"/>

  <g transform="translate(58 48)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#ff9900" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2.4">EPHEMERAL AWS DOCUMENT PIPELINE</text>
    <text x="0" y="74" fill="#f6f8fa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="72" font-weight="750" letter-spacing="-2.6">Vantage AI</text>
    <text x="0" y="124" fill="#aab4bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23">Secure CSV ingestion. Async extraction.</text>
    <text x="0" y="157" fill="#aab4bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="23">Bedrock-powered financial insight.</text>

    <g transform="translate(0 205)">
      <rect width="494" height="52" rx="10" fill="#111820" stroke="#34404c"/>
      <circle cx="22" cy="26" r="5" fill="#58d68d"/>
      <text x="38" y="22" fill="#f6f8fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">QUALITY GATES: PASS</text>
      <text x="38" y="39" fill="#7f8b98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">PYTHON · POSTGRESQL · TERRAFORM · TRIVY · CONTAINER</text>
    </g>

    <text x="0" y="294" fill="#6f7b87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="0.5">FASTAPI / CLOUDFRONT / ECS / S3 / SQS / LAMBDA / RDS / BEDROCK</text>
  </g>

  <g transform="translate(670 42)">
    <rect width="472" height="316" rx="18" fill="url(#panel)" stroke="#303944"/>
    <text x="24" y="31" fill="#7f8b98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.2">VERSIONED DOCUMENT CONTRACT</text>

    <g transform="translate(24 52)">
      <rect width="176" height="84" rx="12" fill="#151b22" stroke="#46515e"/>
      <path d="M20 18H76M20 31H116M20 44H98" stroke="#d0d7de" stroke-width="3" stroke-linecap="round" opacity="0.72"/>
      <text x="20" y="65" fill="#f6f8fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700">source.csv</text>
      <text x="20" y="79" fill="#6f7b87" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">sha256: 7b31…e92c</text>
    </g>

    <path d="M212 94H251" stroke="#ff9900" stroke-width="2.4" marker-end="url(#arrow)"/>

    <g transform="translate(264 52)">
      <rect width="184" height="84" rx="12" fill="#151b22" stroke="#ff9900"/>
      <text x="18" y="24" fill="#ffb84d" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">EDGE + API</text>
      <text x="18" y="49" fill="#f6f8fa" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="650">CloudFront → ECS</text>
      <text x="18" y="69" fill="#7f8b98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">API KEY · CHECKSUM · S3</text>
    </g>

    <path d="M356 146V174" stroke="#ff9900" stroke-width="2.4" marker-end="url(#arrow)"/>

    <g transform="translate(24 184)">
      <rect width="424" height="78" rx="12" fill="#111820" stroke="#34404c"/>
      <g transform="translate(18 16)">
        <circle cx="13" cy="13" r="12" fill="#242d36" stroke="#5d6976"/>
        <text x="13" y="17" text-anchor="middle" fill="#f6f8fa" font-family="ui-monospace, monospace" font-size="10">01</text>
        <text x="34" y="12" fill="#f6f8fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">SQS</text>
        <text x="34" y="28" fill="#6f7b87" font-family="ui-monospace, monospace" font-size="9">versioned job</text>
      </g>
      <path d="M123 39H151" stroke="#56616d" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(160 16)">
        <circle cx="13" cy="13" r="12" fill="#242d36" stroke="#5d6976"/>
        <text x="13" y="17" text-anchor="middle" fill="#f6f8fa" font-family="ui-monospace, monospace" font-size="10">02</text>
        <text x="34" y="12" fill="#f6f8fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">LAMBDA</text>
        <text x="34" y="28" fill="#6f7b87" font-family="ui-monospace, monospace" font-size="9">verify + extract</text>
      </g>
      <path d="M282 39H298" stroke="#56616d" stroke-width="2" marker-end="url(#arrow)"/>
      <g transform="translate(307 16)">
        <circle cx="13" cy="13" r="12" fill="#143425" stroke="#58d68d"/>
        <text x="13" y="17" text-anchor="middle" fill="#8ce7ad" font-family="ui-monospace, monospace" font-size="10">03</text>
        <text x="34" y="12" fill="#f6f8fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700">RDS</text>
        <text x="34" y="28" fill="#6f7b87" font-family="ui-monospace, monospace" font-size="9">idempotent rows</text>
      </g>
    </g>

    <g transform="translate(24 280)">
      <circle cx="6" cy="6" r="5" fill="#58d68d"/>
      <text x="19" y="10" fill="#8f9aa6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">NO NAT</text>
      <circle cx="99" cy="6" r="5" fill="#58d68d"/>
      <text x="112" y="10" fill="#8f9aa6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">DIGEST-PINNED</text>
      <circle cx="237" cy="6" r="5" fill="#58d68d"/>
      <text x="250" y="10" fill="#8f9aa6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10">DESTROY-SAFE</text>
    </g>
  </g>
</svg>
