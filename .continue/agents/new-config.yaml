name: Local Ollama
version: 1.0.0
schema: v1

models:
  - name: Qwen2.5 Coder 7B Chat
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://127.0.0.1:11434
    roles:
      - chat
      - edit
      - apply

  - name: Qwen2.5 Coder 7B Autocomplete
    provider: ollama
    model: qwen2.5-coder:7b-base-q4_K_M
    apiBase: http://127.0.0.1:11434
    roles:
      - autocomplete
    autocompleteOptions:
      debounceDelay: 250
      maxPromptTokens: 2048
      onlyMyCode: true

  - name: Nomic Embed Text
    provider: ollama
    model: nomic-embed-text:latest
    apiBase: http://127.0.0.1:11434
    roles:
      - embed